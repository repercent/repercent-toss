name: Deploy to Apps in Toss (Dev)

permissions:
  contents: read
  id-token: write # AWS 역할을 OIDC로 받는다

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 번들이 동시에 올라가지 않도록 차례로 실행한다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  APP_ENV: dev
  # 빌드 시점에 번들에 들어가는 API 주소. 지정하지 않으면 운영 주소로 빌드된다.
  VITE_PURCHASE_API_URL: https://dev-common-api-purchase.repercent.com
  VITE_AUTH_API_URL: https://dev-auth.repercent.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포 키는 AWS Secrets Manager `repercent/toss/dev/deploy`(JSON)에서 읽는다.
    #   AIT_API_KEY        앱인토스 콘솔 API 키 (워크스페이스 > 키)
    #   VITE_JUSO_API_KEY  도로명주소 검색 API 승인키. 빌드 시점에 번들에 들어간다.
    #   SLACK_WEBHOOK_URL  (선택) 배포 결과 알림
    # job에 environment를 지정하면 OIDC 토큰의 sub가 `environment:dev`로 바뀌어
    # 역할 신뢰 정책(`repo:repercent/*:ref:refs/heads/dev`)과 맞지 않으므로 지정하지 않는다.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # package.json의 packageManager에 적힌 pnpm 버전을 설치한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 키는 의존성 설치 뒤에 읽는다. 설치 스크립트가 배포 키를 보지 않게 하기 위해서다.
      # 다른 repercent 저장소와 같은 OIDC 역할. 이 역할에는 위 secret 읽기 권한만 더했다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::182584328818:role/GitHubActions-dev
          aws-region: ap-northeast-2

      # JSON 키 이름 그대로 환경변수로 넣고, 값은 로그에서 가린다. (secret ID 앞 쉼표 = 이름 접두어 없음)
      - name: Load deploy secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,repercent/toss/dev/deploy
          parse-json-secrets: true

      # 주소 키가 없으면 빌드할 수 없어 실패로 끝낸다. AIT_API_KEY는 선택이다.
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$VITE_JUSO_API_KEY" ]; then
            echo "::error::AWS Secrets Manager 'repercent/toss/dev/deploy'에 VITE_JUSO_API_KEY 값을 넣어야 합니다. (docs/deploy-setup.md 참고)"
            exit 1
          fi
          # AIT_API_KEY가 없으면 빌드까지만 하고 업로드는 건너뛴다. 번들은 콘솔에 직접 올린다.
          if [ -n "$AIT_API_KEY" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AIT_API_KEY가 없어 빌드만 하고 콘솔 업로드는 건너뛰어요."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      # 빌드에는 번들에 들어갈 주소 키만 넘긴다.
      - name: Build (dev)
        run: env -u AIT_API_KEY -u SLACK_WEBHOOK_URL pnpm build

      # 콘솔에 테스트 번들로 올라갈 뿐 출시되지 않는다. 메모로 콘솔에서 dev 번들임을 구분한다.
      - name: Upload bundle
        id: deploy
        if: steps.config.outputs.upload == 'true'
        run: |
          set -o pipefail
          pnpm exec ait deploy --api-key "$AIT_API_KEY" --scheme-only -m "$APP_ENV ${GITHUB_SHA::7}" | tee deploy.log
          SCHEME=$(grep -o 'intoss-private://[^[:space:]]*' deploy.log | tail -1)
          if [ -z "$SCHEME" ]; then
            echo "::error::업로드 결과에서 테스트 스킴을 찾지 못했습니다."
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build summary (upload skipped)
        if: steps.config.outputs.upload != 'true'
        run: |
          {
            echo "### 앱인토스 번들 빌드 완료 ($APP_ENV) — 업로드 생략"
            echo ""
            echo "AIT_API_KEY가 없어 콘솔에 올리지 않았어요. 번들을 빌드해 콘솔에 직접 올려 주세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        if: steps.config.outputs.upload == 'true'
        env:
          SCHEME: ${{ steps.deploy.outputs.scheme }}
        run: |
          {
            echo "### 앱인토스 번들 업로드 완료 ($APP_ENV)"
            echo ""
            echo "- **테스트 스킴**: \`$SCHEME\`"
            echo "- **API**: $VITE_PURCHASE_API_URL, $VITE_AUTH_API_URL"
            echo "- **Commit**: $GITHUB_SHA"
            echo ""
            echo "콘솔 '테스트하기'의 QR이나 위 스킴을 토스 앱에서 열어요. 워크스페이스 멤버만 열 수 있어요."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Slack webhook configuration
        id: slack-webhook
        if: always()
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SLACK_WEBHOOK_URL is not configured"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack - failure
        if: ${{ failure() && steps.slack-webhook.outputs.configured == 'true' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 배포 실패: repercent-toss (${{ env.APP_ENV }})",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *배포 실패* — repercent-toss 앱인토스 번들 (`${{ env.APP_ENV }}`)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 로그 보기>"
                  }
                }
              ]
            }

      - name: Notify Slack - success
        if: ${{ success() && steps.slack-webhook.outputs.configured == 'true' && steps.config.outputs.upload == 'true' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ 테스트 번들 업로드: repercent-toss (${{ env.APP_ENV }})",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *테스트 번들 업로드* — repercent-toss 앱인토스 (`${{ env.APP_ENV }}`)\n• 테스트 스킴: `${{ steps.deploy.outputs.scheme }}`\n• 커밋: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> by ${{ github.actor }}\n토스 앱에서 스킴을 열거나 콘솔 '테스트하기'의 QR로 확인해요."
                  }
                }
              ]
            }
